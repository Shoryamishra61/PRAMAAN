[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pramaan"
version = "0.1.0"
description = "PRAMAAN: AI Risk Manager & Pre-submission Dispute Integrity Gate (CARVE-FECL)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.7,<2",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
research = [
  "sentence-transformers>=3,<4",
  "xgboost>=2.1,<4",
  "z3-solver>=4.13,<5",
]
dev = [
  "httpx>=0.27,<1",
  "hypothesis>=6.120,<7",
  "jsonschema>=4.23,<5",
  "mypy>=1.14,<3",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0.12,<7",
  "types-jsonschema>=4.23,<5",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra --strict-config --strict-markers"
pythonpath = [".", "backend"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["backend/app", "backend/tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "scripts.run_ai_research_study"
ignore_errors = true

[[tool.mypy.overrides]]
module = "z3.*"
ignore_missing_imports = true
